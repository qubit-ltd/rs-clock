[package]
name = "qubit-clock"
version = "0.10.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-clock"
description = "Injectable wall and monotonic clocks with deterministic timers"
homepage = "https://github.com/qubit-ltd/rs-clock"
documentation = "https://docs.rs/qubit-clock"
readme = "README.md"
keywords = ["clock", "time", "monotonic", "mock", "testing"]
categories = ["date-and-time", "development-tools::testing"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/benches/**",
    "/doc/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_clock"
doctest = true

[[test]]
name = "std_timer_scheduler_tests"
path = "tests/timer/internal/std_timer_scheduler_tests.rs"

[[test]]
name = "std_timer_spawn_failure_tests"
path = "tests/timer/internal/std_timer_spawn_failure_tests.rs"

[[bench]]
name = "std_timer_scheduler"
harness = false

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
thiserror = "2.0"
tokio = { version = "1.52", optional = true, features = ["rt", "time"] }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false }
tokio = { version = "1.52", features = ["macros", "rt", "sync", "test-util", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
