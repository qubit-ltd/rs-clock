[package]
name = "qubit-clock"
version = "0.9.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-clock"
description = "Injectable wall and monotonic clocks with deterministic blocking and async sleepers"
homepage = "https://github.com/qubit-ltd/rs-clock"
documentation = "https://docs.rs/qubit-clock"
readme = "README.md"
keywords = ["clock", "time", "monotonic", "mock", "testing"]
categories = ["date-and-time", "development-tools::testing"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_clock"
doctest = true

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
thiserror = "2.0"
tokio = { version = "1.52", optional = true, features = ["time"] }

[dev-dependencies]
tokio = { version = "1.52", features = ["macros", "rt", "sync", "test-util", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
