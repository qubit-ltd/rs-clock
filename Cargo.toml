[package]
name = "qubit-clock"
version = "0.12.1"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-clock"
description = "Injectable wall and monotonic clocks with deterministic timers"
homepage = "https://github.com/qubit-ltd/rs-clock"
documentation = "https://docs.rs/qubit-clock"
readme = "README.md"
keywords = ["clock", "time", "monotonic", "mock", "testing"]
categories = ["date-and-time", "development-tools::testing"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/src/**",
    "/doc/**",
    "/tests/**",
    "/benches/**",
]

[lib]
name = "qubit_clock"
doctest = true

[[test]]
name = "std_timer_scheduler_tests"
path = "tests/timer/internal/std_timer_scheduler_tests.rs"

[[test]]
name = "std_timer_notification_tests"
path = "tests/timer/internal/std_timer_notification_tests.rs"

[[test]]
name = "std_timer_spawn_failure_tests"
path = "tests/timer/internal/std_timer_spawn_failure_tests.rs"

[[test]]
name = "std_timer_worker_failure_tests"
path = "tests/timer/internal/std_timer_worker_failure_tests.rs"

[[bench]]
name = "std_timer_scheduler"
harness = false

[[bench]]
name = "manual_timer"
harness = false

[[bench]]
name = "tokio_timer"
harness = false
required-features = ["tokio"]

[features]
default = []
loom-model = ["dep:loom", "test-util"]
test-util = []
tokio = ["dep:pin-project-lite", "dep:tokio"]

[dependencies]
loom = { version = "0.7", optional = true }
pin-project-lite = { version = "0.2", optional = true }
thiserror = "2.0"
tokio = { version = "1.53", optional = true, features = ["rt", "sync", "time"] }
qubit-collections = { version = "0.2" }

[dev-dependencies]
criterion = { version = "0.8", default-features = false }
tokio = { version = "1.53", features = ["macros", "rt", "sync", "test-util", "time"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)', 'cfg(tokio_unstable)'] }
